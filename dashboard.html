<script id="course-data" type="application/json">[{"number":1,"title":"Introduction & Pre-Quantum Physics","description":"Explore the foundations of physics and the shift from classical ideas to quantum concepts, including observation, uncertainty, and entanglement.","lessons":[{"title":"Pre-Quantum Physics & What Makes Physics Quantum?","html":"<p>Physics studies the fundamental parts of physical reality—matter and energy—and the laws that govern how they behave. Chemistry examines how atoms and molecules combine, while biology studies living systems. Physics provides many of the principles that help explain both fields.</p>\n<p>Physics has several subfields. Thermodynamics studies heat and energy transfer, optics studies light, and electromagnetism studies electric and magnetic phenomena.</p>\n<h3>What makes physics quantum?</h3>\n<p>Quantum physics grew from discoveries made in the early twentieth century. These discoveries changed how scientists describe matter and energy at very small scales. Two central ideas distinguish quantum physics from many classical descriptions:</p>\n<ul><li><strong>Quantization:</strong> Some physical quantities occur in specific, discrete amounts rather than every value along a continuous range.</li><li><strong>Uncertainty and probability:</strong> Quantum theory predicts the probabilities of possible measurement outcomes, and some pairs of physical properties cannot simultaneously have arbitrarily precise values.</li></ul>\n<p>Quantum behavior can seem counterintuitive. When your hand rests on a table, the contact is not simply two perfectly solid surfaces pressing together. At a more fundamental level, the atoms and their particles interact through electromagnetic and quantum processes. The solid surfaces we experience emerge from those interactions.</p>\n<p>Quantum effects become especially noticeable at atomic and subatomic scales. A grain of sand can contain on the order of 10²⁰ atoms. Individual atoms exhibit quantum behavior, but when enormous numbers of particles act together, many microscopic effects average out. The overall object can then be described very effectively by classical physics.</p>\n<p>Scientists began to uncover quantum behavior as experiments made it possible to investigate atoms, electrons, and atomic nuclei directly. Modern explanations of atomic structure—and many technologies built from it—depend on quantum physics.</p>"},{"title":"Measurements and Observables","html":"<p>Quantum mechanics describes the measurable outcomes of experiments involving quantum systems. Its equations can be mathematically demanding, but their predictions are valuable because they can be compared with observed results.</p>\n<p>One challenge is that quantum behavior often conflicts with everyday intuition. Classical physics feels familiar because we routinely experience moving objects, forces, and collisions. At the atomic scale, however, our ordinary expectations do not always apply.</p>\n<h3>Doing the right tests</h3>\n<p>A scientific explanation must agree with experimental evidence. Sometimes a simple test seems to support an intuitive idea, but a more carefully designed experiment reveals what is actually happening.</p>\n<p>For example, if a ball made of lead and a ball made of foam are dropped in air, the lead ball may reach the ground first because air resistance affects them differently. In an experiment that minimizes air resistance, objects fall at the same rate regardless of their mass.</p>\n<p>Good experiments control possible sources of error and use tools that let researchers measure what would otherwise be too small, too fast, or too faint to observe. The invention of instruments such as microscopes and telescopes has repeatedly expanded what scientists can investigate.</p>\n<h3>Trusting results—and verifying them</h3>\n<p>Scientists can be mistaken, so important findings should be tested repeatedly and examined by other researchers. Richard Feynman captured this principle in a famous warning: “The first principle is that you must not fool yourself and you are the easiest person to fool.”</p>\n<p>Quantum experiments have repeatedly confirmed the theory’s predictions, even while physicists continue to debate how best to interpret what those predictions mean. The same theory underlies practical technologies such as semiconductors and transistors, as well as research with particle accelerators and unusual states of matter.</p>"},{"title":"Introduction to Entanglement and Nonlocality","html":"<p><strong>Quantum entanglement</strong> occurs when two or more particles share a joint quantum state, so their measurement outcomes are correlated in ways that cannot be explained by treating each particle as an independent system with ordinary pre-existing properties.</p>\n<p>Imagine two pennies, one minted in 1967 and one in 1999. If they are mixed without looking and one is given to you while the other is kept by someone else, identifying your penny tells both people which penny the other person has. This is a useful analogy for learning about correlations, but it is not a complete model of quantum entanglement: the pennies already have definite identities before anyone looks at them.</p>\n<p>In a quantum experiment, the relevant outcomes can remain uncertain until measurement, while measurements on separated particles still show strong correlations. These results challenge classical intuitions about independently defined properties.</p>\n<p>Entanglement does not provide a way to send messages faster than light. Instead, it describes quantum correlations that cannot be reproduced by many classical models and that are important in quantum information science.</p>"}]},{"number":2,"title":"Classical Physics Foundations","description":"Review the classical ideas that came before quantum theory: mechanics, waves, electromagnetism, atoms, heat, and probability.","lessons":[{"title":"Standing on the Shoulders of Giants: Classical Physics","html":"<p>Classical physics describes many physical systems using concepts and theories developed from the late seventeenth century through the nineteenth century. It covers familiar behavior such as the motion of objects, waves, light, electricity, magnetism, heat, and the behavior of large collections of matter.</p>\n<p>Throughout most of this course, we will explore the quantum world of microscopic objects and elementary particles. To understand why quantum physics was such a major change, it helps to first learn the rules that explain the everyday world.</p>\n<h3>Newton and the foundations of mechanics</h3>\n<p>Isaac Newton made major contributions to the laws of motion, universal gravitation, and optics, and he helped develop calculus. His three laws of motion describe relationships between an object's motion and the forces acting on it.</p>\n<p>Classical physics also developed through the work of many researchers who studied planetary motion, falling objects, heat, and light. These ideas became a powerful framework for predicting the behavior of macroscopic systems. Quantum physics did not make classical physics useless; rather, it revealed where classical descriptions are incomplete and supplied a more fundamental account of matter and energy.</p>"},{"title":"Objects in Motion: Classical Mechanics","html":"<p>Classical mechanics grew from attempts to understand why objects roll, fall, travel through the air, and move across the sky. Isaac Newton unified many of these observations with a small set of laws describing motion and forces.</p>\n<h3>Newton’s three laws of motion</h3>\n<ul><li><strong>First law—inertia:</strong> An object remains at rest or moves in a straight line at constant velocity unless a net external force acts on it.</li><li><strong>Second law:</strong> The net force on an object equals its mass multiplied by its acceleration.</li><li><strong>Third law:</strong> When one object exerts a force on another, the second object exerts an equal and opposite force on the first.</li></ul>\n<div class=\"equation\" role=\"math\">F = ma</div>\n<p>Here, <em>F</em> is the net force, <em>m</em> is mass, and <em>a</em> is acceleration. Force and acceleration are vectors because they have both magnitude and direction. Mass is a scalar because it has magnitude but no direction. The SI unit of force is the newton (N): 1 N = 1 kg·m/s².</p>\n<h3>Energy and motion</h3>\n<p>Newton also used mathematical tools to study gravitation and planetary orbits. Another key quantity is kinetic energy, the energy an object has because it is moving:</p>\n<div class=\"equation\" role=\"math\">KE = ½mv²</div>\n<p>In this equation, <em>m</em> is mass and <em>v</em> is speed. Energy is measured in joules (J), where 1 J = 1 kg·m²/s².</p>\n<p>Other forms of energy include gravitational potential energy, thermal energy, electrical energy, chemical energy, and nuclear energy. Momentum is also useful for describing motion, especially when direction matters, but its calculation is not needed for the basic kinetic-energy relationship above.</p>"},{"title":"Catching the Waves & Wave Interference","html":"<p>Waves transfer energy and appear in many physical systems. They occur in fluids and sound, and wave-like patterns can also describe oscillations such as a weight moving on a spring.</p>\n<h3>Properties of waves</h3>\n<ul><li><strong>Amplitude (A):</strong> The maximum displacement from the equilibrium position.</li><li><strong>Crest and trough:</strong> The highest and lowest points of a transverse wave.</li><li><strong>Period (T):</strong> The time required for one complete cycle.</li><li><strong>Frequency (f):</strong> The number of cycles per second. Frequency is the reciprocal of period.</li><li><strong>Wavelength (λ):</strong> The distance between corresponding points on successive cycles, such as crest to crest.</li><li><strong>Wave speed (v):</strong> The distance a wave pattern travels per unit time.</li></ul>\n<p>Wave speed is related to wavelength and frequency by:</p>\n<div class=\"equation\" role=\"math\">v = λf = λ/T</div>\n<p>Sine and cosine functions are useful mathematical models for smooth, repeating waves. Defining the variables carefully lets scientists describe wave behavior with equations and compare models with observations.</p>\n<h3>Superposition and interference</h3>\n<p>When two waves overlap, their displacements combine. This is called <strong>superposition</strong>. The combined wave can produce interference.</p>\n<ul><li><strong>Constructive interference</strong> occurs when overlapping waves reinforce one another, creating a larger amplitude.</li><li><strong>Destructive interference</strong> occurs when overlapping waves oppose one another, reducing or even cancelling the displacement.</li></ul>\n<p>Interference and superposition are important in the study of sound and light, and they later become central to understanding quantum behavior.</p>"},{"title":"Electromagnetism & Maxwell's Equations","html":"<p>Before the modern understanding of light emerged, scientists debated whether light was made of particles or behaved as a wave. Christian Huygens developed a wave-based description, while Isaac Newton argued that light traveled as tiny particles called corpuscles. Newton’s book <em>Opticks</em> (1704) explained reflection and refraction using his particle-based view.</p>\n<h3>Diffraction and the double-slit experiment</h3>\n<p>Waves can spread around obstacles or after passing through a narrow opening. This behavior is called <strong>diffraction</strong>. In 1802, Thomas Young demonstrated that light passing through two narrow slits produces alternating bright and dark bands. The pattern is explained by interference between the waves from the two openings and provided strong evidence for light’s wave-like behavior.</p>\n<p>Neither a simple particle model nor a simple wave model answered every question about light. The wave interpretation became prominent during the nineteenth century, especially as researchers discovered a connection between electricity and magnetism.</p>\n<h3>Maxwell and electromagnetic waves</h3>\n<p>Michael Faraday and other researchers showed that electricity and magnetism are closely related. James Clerk Maxwell brought these ideas together into a set of four equations describing electromagnetism. The equations predict electromagnetic waves that travel at the speed of light, providing a deep connection between light, electricity, and magnetism.</p>\n<p>Visible light is only a small part of the electromagnetic spectrum. From lower frequency and energy to higher frequency and energy, the main regions are radio waves, microwaves, infrared, visible light, ultraviolet, X-rays, and gamma rays.</p>\n<h3>The ether question</h3>\n<p>Many nineteenth-century physicists believed that light waves needed a medium, called the ether, to carry them through space. In 1887, Albert Michelson and Edward Morley tested for the expected motion of Earth relative to this medium but did not detect the predicted effect. The result weakened the ether hypothesis. In 1905, Albert Einstein treated the speed of light in a vacuum as constant in his theory of special relativity, removing the need for a stationary ether as the carrier of light.</p>"},{"title":"Pre-Quantum Views of Atoms & Electrons","html":"<p>The idea that matter is made of atoms is ancient, but it took centuries of evidence before atomic theory became widely accepted. The Greek thinker Democritus argued that matter could not be divided forever and must ultimately consist of tiny units. For a long time, this remained a philosophical proposal rather than a claim supported by direct experimental evidence.</p>\n<h3>Chemistry and atomic theory</h3>\n<p>By the 1700s, chemists distinguished elements from compounds. In 1808, John Dalton used the whole-number ratios found in chemical reactions to argue that matter is composed of atoms that combine in specific proportions.</p>\n<p>In 1905, Albert Einstein developed a quantitative explanation of Brownian motion—the irregular movement of tiny particles suspended in a fluid. Later experimental confirmation helped strengthen the case that atoms are real physical entities.</p>\n<h3>The discovery of the electron</h3>\n<p>In 1897, J. J. Thomson used cathode-ray experiments to show that the rays contained negatively charged particles much lighter than atoms. These particles became known as electrons. Their discovery revealed that atoms were not indivisible and raised a new question: how are electrons arranged within an atom?</p>\n<h3>Spectroscopy: studying elements with light</h3>\n<p>Spectroscopy examines the light emitted or absorbed by matter. In the 1860s, Robert Bunsen and Gustav Kirchhoff showed that elements produce characteristic spectral lines. By analyzing those lines, scientists can identify elements in laboratory samples—and even in light arriving from distant stars.</p>"},{"title":"Thermodynamics & Classical Probability","html":"<p>Thermodynamics studies heat, energy transfer, and how energy can be converted into useful work. It focuses on the overall state of a system rather than tracking every particle individually. Scientists now understand temperature in terms of microscopic motion, although the early laws of thermodynamics were developed before atoms were widely accepted.</p>\n<h3>The laws of thermodynamics</h3>\n<ul><li><strong>First law:</strong> Energy is conserved; it can change form or move between a system and its surroundings, but it is not created or destroyed.</li><li><strong>Second law:</strong> In a spontaneous process, the total entropy of an isolated system does not decrease.</li><li><strong>Third law:</strong> As a system approaches absolute zero, its entropy approaches a well-defined limiting value under the usual assumptions of the law.</li></ul>\n<p>The study of thermal radiation led scientists to investigate an idealized object called a black body, which absorbs incoming radiation and emits radiation according to its temperature. Attempts to explain its spectrum eventually helped launch quantum physics.</p>\n<h3>The Games People Play: Unknowns and Uncertainties</h3>\n<p>Classical physics is deterministic in principle: if every relevant condition were known with perfect precision, its laws would determine the system’s future. In practice, many systems are too complicated to measure that precisely, so probability is used to summarize how likely different outcomes are.</p>\n<p>Measurements also have uncertainty because instruments have limited precision and repeated trials rarely produce perfectly identical readings. Scientists record measurement precision, repeat experiments, compare results, and use statistics to describe variation.</p>\n<p>The mean describes the central value of a set of measurements. Variance and standard deviation describe their spread; standard deviation is the square root of variance. In quantum physics, probability has a deeper role: it is part of the theory’s predictions even when the experimental setup is carefully controlled.</p>"}]},{"number":3,"title":"The Quantum Revolution","description":"Follow the early experiments and discoveries that challenged classical physics and established the first ideas of quantum theory.","lessons":[{"title":"Black-Body Radiation & Max Planck's Quantization","html":"<p>Quantization—the idea that some quantities occur in discrete amounts rather than continuously—was introduced to physics through the problem of black-body radiation. A hot object emits electromagnetic radiation; as its temperature increases, the radiation becomes more intense and its spectrum shifts.</p>\n<p>A black body is an ideal object that absorbs all radiation falling on it and emits radiation determined by its temperature. A hollow cavity with a small opening provides a useful approximation: radiation entering the opening is repeatedly reflected inside and is likely to be absorbed.</p>\n<p>By the late nineteenth century, classical models could not correctly describe the measured black-body spectrum across all frequencies. Wien’s law worked in one part of the spectrum, while the Rayleigh–Jeans law worked in another. No single classical description matched the full results.</p>\n<h3>Planck’s quantum hypothesis</h3>\n<p>In 1900, Max Planck proposed that energy exchanged by the oscillators in the cavity could occur only in discrete amounts. The energy levels are proportional to the oscillator’s frequency:</p>\n<div class=\"equation\" role=\"math\">Eₙ = n hν, &nbsp; n = 0, 1, 2, …</div>\n<p>Here, <em>ν</em> is frequency and <em>h</em> is Planck’s constant, approximately 6.626 × 10⁻³⁴ joule-seconds. The factor <em>n</em> labels the allowed energy level. Introducing this quantization allowed Planck to reproduce the observed black-body spectrum where classical models failed.</p>\n<p>Planck initially treated quantization as a way to obtain the correct formula, but the idea became one of the foundations of quantum physics. It showed that the continuous energy picture used in classical physics could not explain every microscopic process.</p>"},{"title":"Light as Particles: The Photoelectric Effect","html":"<p>Experiments involving light and matter revealed that light cannot be described completely as a classical wave. The photoelectric effect occurs when light shines on a metal and electrons are emitted from its surface.</p>\n<h3>What the experiments showed</h3>\n<p>Classical wave theory suggested that brighter light should transfer more energy to electrons and that sufficiently weak light might take time to eject them. Experiments instead showed that electrons are emitted promptly when the light frequency is high enough. Below a threshold frequency, increasing the light’s intensity does not cause electrons to be emitted.</p>\n<h3>Einstein’s photon hypothesis</h3>\n<p>In 1905, Albert Einstein proposed that light exchanges energy in discrete packets called photons. The energy of one photon is proportional to its frequency:</p>\n<div class=\"equation\" role=\"math\">E<sub>photon</sub> = hν</div>\n<p>An electron must receive enough energy to escape the metal. The minimum required energy is the <strong>work function</strong>, φ. For a photon with sufficient energy, the maximum kinetic energy of an emitted electron is:</p>\n<div class=\"equation\" role=\"math\">K<sub>max</sub> = hν − φ</div>\n<p>The threshold frequency is ν₀ = φ/h. This explains why frequency determines the energy available from each photon, while increasing intensity at a fixed frequency increases the number of photons arriving per second.</p>\n<p>Einstein’s explanation showed that light has particle-like properties as well as wave-like behavior. The photoelectric effect became important evidence for the quantization of light.</p>"},{"title":"Bohr's Atomic Model","html":"<p>By the late nineteenth century, scientists had evidence that atoms contained electrons, but they did not yet have a satisfactory model of how the electrons were arranged. Ernest Rutherford proposed a nuclear model in which a small, positively charged nucleus is surrounded by electrons.</p>\n<p>The classical picture raised a problem: an electron moving around a nucleus should radiate energy and lose it, so the atom would not remain stable. At the same time, experiments showed that atoms emit and absorb light at particular wavelengths, forming discrete spectral lines rather than a continuous spectrum.</p>\n<h3>Bohr’s quantized energy levels</h3>\n<p>In 1913, Niels Bohr proposed that an electron in hydrogen could occupy only certain allowed energy levels. While an electron remains in an allowed level, it does not radiate energy in the way predicted by the classical orbit model. When it moves between levels, the atom absorbs or emits a photon whose energy equals the difference between the two levels.</p>\n<div class=\"equation\" role=\"math\">ΔE = hν</div>\n<p>This model explained important features of hydrogen’s spectrum and showed how quantization could account for stable atomic states. It was a major step toward quantum theory.</p>\n<h3>What the model could—and could not—explain</h3>\n<p>Bohr’s model worked well for hydrogen and hydrogen-like systems, but it could not accurately describe every feature of atoms with multiple electrons. Modern quantum mechanics replaced the picture of electrons moving on fixed classical orbits with quantum states described by wave functions and probabilities. Bohr’s model remains valuable historically because it introduced quantized atomic energy levels.</p>"},{"title":"Heisenberg Uncertainty Principle & Quantum Probability","html":"<p>Probability is familiar from classical situations in which the outcome is uncertain because details are unknown. Quantum physics uses probability differently: even when a system is prepared carefully, the theory generally predicts probabilities for measurement outcomes rather than a single certain result for every individual trial.</p>\n<p>Albert Einstein famously objected to this view with the phrase “God does not play dice.” His concerns helped motivate important discussions about the meaning of quantum theory, but experiments have repeatedly supported its probabilistic predictions.</p>\n<h3>The Heisenberg uncertainty principle</h3>\n<p>In classical physics, position and momentum can be specified as precisely as the measuring instruments allow. Quantum mechanics places a fundamental limit on how precisely position and momentum in the same direction can be jointly specified. The uncertainty is not simply caused by imperfect equipment.</p>\n<div class=\"equation\" role=\"math\">Δx · Δpₓ ≥ ℏ/2</div>\n<p>Here, Δx represents the uncertainty in position, Δpₓ is the uncertainty in momentum along the x-direction, and ℏ is the reduced Planck constant. Making the position distribution narrower requires a broader spread in momentum, and vice versa.</p>\n<h3>Wave functions and quantum probability</h3>\n<p>A quantum state can be represented by a wave function, often written as ψ(x,t). The wave function itself is generally not a directly measured probability. According to the Born rule, its squared magnitude, |ψ(x,t)|², gives the probability density for position measurements.</p>\n<p>This means quantum probability is part of the theory’s predictions, not merely a placeholder for missing information about a classical outcome. Repeated measurements on identically prepared systems produce a distribution of results, and that distribution can be compared with the probability predicted by the wave function.</p>\n<p>Statistical tools such as averages and standard deviations help summarize experimental outcomes. They are especially useful when comparing a predicted probability distribution with measured data.</p>"}]},{"number":4,"title":"Light and Classical Optics","description":"Investigate light through reflection, refraction, lenses, interference, diffraction, and polarization, and see where classical wave theory reaches its limits.","lessons":[{"title":"The Nature of Light","html":""},{"title":"Reflection and Refraction of Light","html":""},{"title":"Lenses, Mirrors, and Image Formation","html":""},{"title":"Interference of Light","html":""},{"title":"Diffraction and the Limits of Optical Resolution","html":""},{"title":"Polarization","html":""},{"title":"The Electromagnetic Spectrum","html":""},{"title":"Classical Wave Theory and Its Limitations","html":""}]},{"number":5,"title":"Black-Body Radiation and Planck’s Quantum Hypothesis","description":"Follow the puzzle of black-body radiation and the ultraviolet catastrophe to Planck’s proposal that energy is exchanged in discrete quanta.","lessons":[{"title":"Thermal Radiation and Heated Objects","html":""},{"title":"Black-Body Radiation","html":""},{"title":"The Ultraviolet Catastrophe","html":""},{"title":"Max Planck and the Quantization of Energy","html":""},{"title":"Planck’s Constant and Energy Quanta","html":""},{"title":"The Planck Radiation Law","html":""},{"title":"Classical Physics Versus Quantum Physics","html":""},{"title":"Historical Significance of Planck’s Discovery","html":""}]},{"number":6,"title":"The Photoelectric Effect and Einstein’s Light Quanta","description":"Examine experiments showing that light transfers energy in photons, and learn how frequency, work function, and threshold frequency determine emitted-electron energy.","lessons":[{"title":"The Photoelectric Effect: Experimental Observations","html":""},{"title":"The Failure of Classical Wave Theory","html":""},{"title":"Einstein’s Photon Hypothesis","html":""},{"title":"Photon Energy and Frequency","html":""},{"title":"Work Function and Threshold Frequency","html":""},{"title":"Maximum Kinetic Energy of Photoelectrons","html":""},{"title":"Experimental Verification of Einstein’s Theory","html":""},{"title":"Applications of the Photoelectric Effect","html":""}]},{"number":7,"title":"Atomic Spectra and Bohr’s Model of the Atom","description":"Explore how atomic emission and absorption spectra revealed discrete energy levels, how Bohr modeled hydrogen, and why newer quantum ideas were needed.","lessons":[{"title":"The Structure of the Atom","html":""},{"title":"Rutherford’s Nuclear Model","html":""},{"title":"Atomic Emission and Absorption Spectra","html":""},{"title":"The Hydrogen Spectrum","html":""},{"title":"Bohr’s Quantized Energy Levels","html":""},{"title":"Electron Transitions and Photon Emission","html":""},{"title":"Limitations of Bohr’s Atomic Model","html":""},{"title":"From Bohr’s Model to Modern Quantum Mechanics","html":""}]},{"number":8,"title":"Wave-Particle Duality and Matter Waves","description":"Discover how light and matter can display both wave-like and particle-like behavior through de Broglie waves, electron diffraction, and the double-slit experiment.","lessons":[{"title":"Wave-Particle Duality: An Introduction","html":""},{"title":"de Broglie’s Matter-Wave Hypothesis","html":""},{"title":"The de Broglie Wavelength","html":""},{"title":"Electron Diffraction","html":""},{"title":"The Davisson–Germer Experiment","html":""},{"title":"The Double-Slit Experiment","html":""},{"title":"Quantum Superposition and Interference","html":""},{"title":"The Complementarity Principle","html":""}]},{"number":9,"title":"Uncertainty, Wave Functions, and Quantum Probability","description":"Build intuition for quantum predictions using wave functions, the Born rule, uncertainty, probability distributions, statistical quantities, and measurement.","lessons":[{"title":"Classical Probability Versus Quantum Probability","html":""},{"title":"Heisenberg’s Uncertainty Principle","html":""},{"title":"Understanding Wave Functions","html":""},{"title":"The Born Rule and Probability Density","html":""},{"title":"Statistical Thinking in Physics","html":""},{"title":"Expected Values, Variance, and Standard Deviation","html":""},{"title":"Time and Energy Uncertainty","html":""},{"title":"Measurement and Quantum Predictions","html":""}]},{"number":10,"title":"Antimatter, Pair Production, and Energy-Mass Equivalence","description":"Trace the prediction and discovery of antimatter, understand particle tracks and pair production or annihilation, and connect these processes to mass-energy equivalence and conservation laws.","lessons":[{"title":"Dirac’s Prediction of Antimatter","html":""},{"title":"Discovering the Positron","html":""},{"title":"Particle Tracks and Cloud Chambers","html":""},{"title":"Pair Production","html":""},{"title":"Pair Annihilation","html":""},{"title":"Einstein’s Mass-Energy Equivalence","html":""},{"title":"Conservation Laws in Particle Physics","html":""},{"title":"Applications of Antimatter Physics","html":""}]},{"number":11,"title":"Quantum Electrodynamics and Feynman Diagrams","description":"Learn how quantum electrodynamics describes interactions between light and charged particles, and how Feynman diagrams represent interactions and calculations.","lessons":[{"title":"From Classical Electromagnetism to QED","html":""},{"title":"Photons and Quantized Electromagnetic Interactions","html":""},{"title":"Richard Feynman and the Development of QED","html":""},{"title":"Understanding Feynman Diagrams","html":""},{"title":"Vertices, Internal Lines, and Interaction Diagrams","html":""},{"title":"Virtual Particles and Quantum Interactions","html":""},{"title":"Perturbation Theory and Renormalization","html":""},{"title":"Experimental Tests and the Success of QED","html":""}]},{"number":12,"title":"Inside the Nucleus: Nuclear Forces and the Standard Model","description":"Look inside the nucleus and explore quarks, gluons, bosons, and fundamental forces before surveying the Standard Model, the Higgs field, and unanswered questions.","lessons":[{"title":"The Structure of the Atomic Nucleus","html":""},{"title":"Protons, Neutrons, and Quarks","html":""},{"title":"The Strong Nuclear Interaction","html":""},{"title":"The Weak Nuclear Interaction","html":""},{"title":"Gluons, W and Z Bosons, and Fundamental Interactions","html":""},{"title":"Particle Accelerators and Detectors","html":""},{"title":"The Standard Model of Particle Physics","html":""},{"title":"The Higgs Boson and the Higgs Field","html":""},{"title":"What the Standard Model Cannot Explain","html":""},{"title":"The Future of Modern Physics: Quantum Gravity and Beyond","html":""}]}]</script>
<script>
(function(){
  const units = JSON.parse(document.getElementById('course-data').textContent);
  const app = document.getElementById('app');
  const params = new URLSearchParams(location.search);
  const requestedUnit = Number(params.get('unit')) || 0;
  const requestedLesson = Number(params.get('lesson')) || 0;
  const storageKey = 'quantumly-qms-completed-v2';
  function getCompleted(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch(e){return []}}
  let completed = getCompleted().filter(k => { const parts=String(k).split('-'); if(parts.length!==2) return false; const u=unitByNum(Number(parts[0])); const l=Number(parts[1]); return !!u && Number.isInteger(l) && l>=1 && l<=u.lessons.length; });
  const totalLessons = units.reduce((n,u)=>n+u.lessons.length,0);
  const completedCount = () => completed.length;
  const pct = () => Math.round(completedCount()/totalLessons*100);
  const keyFor = (u,l) => u+'-'+l;
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const unitByNum = n => units.find(u=>u.number===n);
  const countUnitDone = u => u.lessons.filter((_,i)=>completed.includes(keyFor(u.number,i+1))).length;
  function save(){try{localStorage.setItem(storageKey,JSON.stringify(completed));}catch(e){/* Progress remains available for this session if browser storage is restricted. */}}
  function lessonUrl(u,l){return 'dashboard.html?unit='+encodeURIComponent(u)+'&lesson='+encodeURIComponent(l)}
  function firstIncomplete(){for(const u of units){for(let i=1;i<=u.lessons.length;i++){if(!completed.includes(keyFor(u.number,i)))return {u:u.number,l:i}}}return {u:1,l:1}}
  function courseCard(){
    const next=firstIncomplete(); const u=unitByNum(next.u); const lesson=u.lessons[next.l-1];
    return `<div class="panel panel-pad"><div class="course-banner"><div><div class="course-icon" aria-hidden="true">⌁</div><div class="panel-kicker">Your course</div><h2>Quantum Mechanics Made Simple</h2><p>An approachable intro to quantum mechanics, from classical foundations to the discoveries that reshaped modern physics.</p><div class="progress-line"><div class="progress-fill" style="width:${pct()}%"></div></div><div class="progress-meta"><span>${completedCount()} of ${totalLessons} lessons complete</span><span>${pct()}%</span></div><div class="course-actions"><a class="button button-primary" href="${lessonUrl(next.u,next.l)}">${completedCount() ? 'Continue learning' : 'Start learning'} →</a><a class="button button-ghost" href="quantum-mechanics.html#units">Browse course outline</a></div></div><div class="stats"><div class="stat"><strong>12</strong><span>COURSE UNITS</span></div><div class="stat"><strong>${totalLessons}</strong><span>LESSONS</span></div><div class="stat"><strong>${pct()}%</strong><span>COMPLETED</span></div></div></div></div>`;
  }
  function renderHome(){
    const next=firstIncomplete(); const nextUnit=unitByNum(next.u); const nextLesson=nextUnit.lessons[next.l-1];
    app.innerHTML=`<div class="topline"><div><div class="eyebrow">Learning dashboard</div><h1 class="page-title">Welcome back to Quantumly.</h1><p class="welcome">Pick up where you left off, explore your course units, and track your progress as you learn.</p></div><a class="button button-ghost" href="index.html#courses">← All courses</a></div><div class="grid"><div>${courseCard()}<h2 class="section-title">Your course units</h2><div class="unit-cards">${units.map(u=>{const done=countUnitDone(u);const up=Math.round(done/u.lessons.length*100);return `<a class="unit-card" href="${lessonUrl(u.number,Math.min(done+1,u.lessons.length))}"><div class="unit-card-top"><span>UNIT ${String(u.number).padStart(2,'0')}</span><span>${done}/${u.lessons.length}</span></div><h3>${escapeHtml(u.title)}</h3><p>${escapeHtml(u.description)}</p><div class="mini-progress"><span style="width:${up}%"></span></div><div class="unit-card-bottom"><span>${u.lessons.length} lessons</span><span>${up}% complete →</span></div></a>`}).join('')}</div></div><aside><div class="panel panel-pad continue-card"><div class="course-icon" aria-hidden="true">▶</div><div class="panel-kicker">Pick up where you left off</div><h2 class="resume-title">${escapeHtml(nextLesson.title)}</h2><p>Unit ${next.u}: ${escapeHtml(nextUnit.title)}</p><div class="course-actions"><a class="button button-primary" href="${lessonUrl(next.u,next.l)}">Open lesson →</a></div></div><div class="panel panel-pad" style="margin-top:16px"><div class="panel-kicker">Course path</div><h2>From the familiar to the quantum</h2><p>Build from physical intuition, then explore how experiments challenged classical explanations. Read the available lessons, mark them complete, and track your progress through the course.</p><div class="course-actions"><a class="button button-ghost" href="quantum-mechanics.html#units">View all 12 units</a></div></div><p class="no-content-note">Progress is saved only in this browser on this device. An account-based sync system is not connected yet.</p></aside></div>`;
  }
  function renderSideBar(activeU,activeL){
    return `<aside class="panel sidebar"><div class="side-header"><strong>Quantum Mechanics Made Simple</strong><small>${completedCount()} / ${totalLessons} lessons complete · ${pct()}%</small><div class="progress-line"><div class="progress-fill" style="width:${pct()}%"></div></div><a class="nav-link" href="quantum-mechanics.html#units">← Course overview</a></div>${units.map(u=>`<details class="side-unit" ${u.number===activeU?'open':''}><summary><span class="side-num">${String(u.number).padStart(2,'0')}</span><span><span class="side-unit-title">${escapeHtml(u.title)}</span><span class="side-unit-meta">${countUnitDone(u)}/${u.lessons.length} lessons complete</span></span><span class="side-chevron">${u.number===activeU?'−':'+'}</span></summary><div class="side-lessons">${u.lessons.map((l,i)=>{let done=completed.includes(keyFor(u.number,i+1));let active=u.number===activeU&&i+1===activeL;return `<a class="side-lesson ${active?'active':''}" href="${lessonUrl(u.number,i+1)}"><span class="check">${done?'✓':'○'}</span><span>${i+1}. ${escapeHtml(l.title)}</span></a>`}).join('')}</div></details>`).join('')}</aside>`;
  }
  function renderLesson(uNum,lNum){
    const u=unitByNum(uNum); if(!u){renderHome();return}
    const lNumSafe=Math.min(Math.max(lNum,1),u.lessons.length); const l=u.lessons[lNumSafe-1]; const done=completed.includes(keyFor(uNum,lNumSafe));
    const prev = lNumSafe>1 ? {u:uNum,l:lNumSafe-1} : (()=>{const p=units.find(x=>x.number===uNum-1);return p?{u:p.number,l:p.lessons.length}:null})();
    const next = lNumSafe<u.lessons.length ? {u:uNum,l:lNumSafe+1} : (()=>{const n=units.find(x=>x.number===uNum+1);return n?{u:n.number,l:1}:null})();
    const body = l.html ? `<div class="lesson-body">${l.html}</div>` : `<div class="lesson-placeholder"><h3>Lesson text coming soon</h3><p>This lesson is included in the Quantumly curriculum, but its full reading text has not been added to the current source material yet.</p><p style="margin-top:10px">You can continue through the lesson outline or return to the course overview.</p><div class="course-actions"><a class="button button-ghost" href="quantum-mechanics.html#units">View course outline</a></div></div>`;
    app.innerHTML=`<div class="topline"><div><div class="eyebrow">Course dashboard / Unit ${uNum}</div><h1 class="page-title">${escapeHtml(l.title)}</h1><p class="welcome">${escapeHtml(u.title)} · Lesson ${lNumSafe} of ${u.lessons.length}</p></div><a class="button button-ghost" href="dashboard.html">Dashboard</a></div><div class="unit-layout">${renderSideBar(uNum,lNumSafe)}<section class="panel reader"><div class="reader-head"><div><div class="breadcrumbs"><a href="index.html#top">quantumly</a> / <a href="quantum-mechanics.html#units">Course</a> / Unit ${uNum}</div><h2 class="reader-title">${escapeHtml(l.title)}</h2><div class="reader-meta">Unit ${String(uNum).padStart(2,'0')} · ${u.lessons.length} lessons in this unit</div></div><span class="panel-kicker">${done?'COMPLETED':'READING'}</span></div><div class="reader-content">${body}</div><div class="reader-footer"><button class="button ${done?'complete-btn done':'button-primary'}" id="completeBtn">${done?'✓ Completed — mark incomplete':'Mark lesson complete ✓'}</button><div style="display:flex;gap:8px;flex-wrap:wrap">${prev?`<a class="button button-ghost" href="${lessonUrl(prev.u,prev.l)}">← Previous</a>`:''}${next?`<a class="button button-ghost" href="${lessonUrl(next.u,next.l)}">Next lesson →</a>`:`<a class="button button-ghost" href="dashboard.html">Finish / dashboard →</a>`}</div></div></section></div>`;
    document.getElementById('completeBtn').addEventListener('click',()=>{const k=keyFor(uNum,lNumSafe);completed=completed.includes(k)?completed.filter(x=>x!==k):completed.concat(k);save();renderLesson(uNum,lNumSafe)});
  }
  if(requestedUnit>0&&requestedLesson>0) renderLesson(requestedUnit,requestedLesson); else renderHome();
})();
</script>
</body>
